[package]
name = "tetorica-fm2612-playground-tauri"
version = "0.61.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
git2 = { version = "0.21", features = ["vendored-libgit2", "ssh", "https", "vendored-openssl"] }
ssh-key = { version = "0.6", features = ["ed25519", "encryption", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
rfd = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSSecureTextField", "NSTextField", "NSView", "NSControl"] }
objc2-foundation = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

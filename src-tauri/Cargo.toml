[package]
name = "tetorica-fm2612-playground-tauri"
version = "0.83.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
zeroize = "1"
rfd = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSPopUpButton", "NSSecureTextField", "NSTextField", "NSView", "NSControl"] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
gtk = "0.18"

[features]
custom-protocol = ["tauri/custom-protocol"]
